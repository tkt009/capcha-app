<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .captcha-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            gap: 15px;
        }

        .captcha-text {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            flex: 1;
            text-align: center;
            user-select: none;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 45px;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        #userInput {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        #userInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .decipher-btn, .reset-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .decipher-btn {
            background: #667eea;
            color: white;
        }

        .decipher-btn:hover {
            background: #5568d3;
        }

        .decipher-btn:active {
            transform: translateY(2px);
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background: #c0c0c0;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="captcha-container">
        <h1>CAPTCHA Verification</h1>

        <div class="captcha-box">
            <div class="captcha-text" id="captchaText">LOADING...</div>
            <button class="refresh-btn" id="refreshBtn" title="Generate new CAPTCHA">🔄</button>
        </div>

        <div class="form-group">
            <label for="userInput">Enter the text from the image above:</label>
            <input 
                type="text" 
                id="userInput" 
                placeholder="Enter CAPTCHA text here..."
                autocomplete="off"
            >
        </div>

        <div class="button-group">
            <button class="decipher-btn" id="decipherBtn">Decipher</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let currentCaptcha = '';

        // Initialize CAPTCHA on page load
        document.addEventListener('DOMContentLoaded', function() {
            generateNewCaptcha();
        });

        // Generate new CAPTCHA
        async function generateNewCaptcha() {
            try {
                const response = await fetch('/capcha/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to generate CAPTCHA');
                }

                const data = await response.json();
                currentCaptcha = data.captcha;
                document.getElementById('captchaText').textContent = currentCaptcha;
                document.getElementById('userInput').value = '';
                clearMessage();
            } catch (error) {
                console.error('Error:', error);
                showMessage('Failed to generate CAPTCHA. Please try again.', 'error');
            }
        }

        // Decipher: populate the input with the current CAPTCHA (no server verification)
        document.getElementById('decipherBtn').addEventListener('click', function() {
            if (!currentCaptcha) {
                showMessage('No CAPTCHA loaded yet. Click refresh to generate one.', 'error');
                return;
            }
            document.getElementById('userInput').value = currentCaptcha;
            showMessage('CAPTCHA populated into the textbox.', 'success');
        });

        // Refresh CAPTCHA
        document.getElementById('refreshBtn').addEventListener('click', function() {
            generateNewCaptcha();
        });

        // (No clear button - refresh already clears the textbox)

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        // Clear message
        function clearMessage() {
            const messageEl = document.getElementById('message');
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        // Allow Enter key to submit
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('decipherBtn').click();
            }
        });
    </script>
</body>
</html>
